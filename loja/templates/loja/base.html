<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boutique Marinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        :root {
            --azul-marinho: #0A1931;
            --azul-marinho-claro: #152C55;
            --branco-creme: #FDFBF7;
            --creme-escuro: #F3EFE6;
        }

        body {
            background-color: var(--branco-creme);
            color: var(--azul-marinho);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Mantém o rodapé sempre no final da tela */
        }

        /* --- UTILITÁRIOS GERAIS --- */
        .bg-marinho {
            background-color: var(--azul-marinho) !important;
        }

        .text-marinho {
            color: var(--azul-marinho) !important;
        }

        .btn-marinho {
            background-color: var(--azul-marinho);
            color: var(--branco-creme);
            border: 2px solid var(--azul-marinho);
            transition: all 0.3s ease;
        }

        .btn-marinho:hover {
            background-color: var(--branco-creme);
            color: var(--azul-marinho);
        }

        .btn-creme {
            background-color: var(--creme-escuro);
            color: var(--azul-marinho);
            border: 1px solid var(--azul-marinho-claro);
        }

        .btn-creme:hover {
            background-color: var(--azul-marinho-claro);
            color: var(--branco-creme);
        }

        /* --- ESTILOS DA VITRINE --- */
        .card-roupa {
            background-color: white;
            border: 1px solid var(--creme-escuro);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(10, 25, 49, 0.08);
            transition: transform 0.3s ease;
        }

        .card-roupa:hover {
            transform: translateY(-5px);
        }

        /* --- ESTILOS DE FORMULÁRIOS (Nova Peça / Editar) --- */
        form p {
            margin-bottom: 1.5rem;
        }

        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--azul-marinho);
        }

        form input,
        form select,
        form textarea {
            display: block;
            width: 100%;
            padding: 0.6rem 0.75rem;
            font-size: 1rem;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            transition: border-color 0.15s;
        }

        form input:focus,
        form select:focus {
            border-color: var(--azul-marinho);
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(10, 25, 49, 0.25);
        }

        .helptext {
            display: block;
            font-size: 0.85em;
            color: #6c757d;
            margin-top: 0.3rem;
        }

        /* --- ESTILOS DA EXCLUSÃO --- */
        .card-delete {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(10, 25, 49, 0.1);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background-color: #ffebee;
            color: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -40px auto 20px;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.2);
        }
    </style>
</head>

<body>

    <!-- NAVBAR FIXA PARA TODAS AS PÁGINAS -->
    <nav class="navbar navbar-expand-lg bg-marinho navbar-dark py-3 shadow-sm">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                <i class="bi bi-shop me-2"></i>Boutique Marinho
            </a>

            <div class="ms-auto">
                <!-- O bloco nav_actions permite que outras telas mudem os botões do menu, se quiserem -->
                {% block nav_actions %}
                {% if user.is_authenticated %}
                <a href="{% url 'peca_create' %}" class="btn btn-outline-light rounded-pill px-4">
                    <i class="bi bi-plus-lg me-1"></i> Nova Peça
                </a>
                {% endif %}
                {% endblock %}
            </div>
        </div>
    </nav>

    <!-- O CONTEÚDO ESPECÍFICO DE CADA PÁGINA SERÁ INJETADO AQUI -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER FIXO PARA TODAS AS PÁGINAS -->
    <footer class="py-4 bg-marinho mt-auto">
        <div class="container">
            <p class="m-0 text-center" style="color: var(--branco-creme);">
                &copy; 2026 Boutique Marinho. Todos os direitos reservados.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
